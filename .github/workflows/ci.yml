# Lint + typecheck + tests on every push/PR (ADR-033). Tests run on all three OSes so the
# golden-hash save test proves byte-identical files across platforms and timezones.
name: ci

on:
  # PRs get the fast check; pushes to main get the full 3-OS run. (Before: every branch push AND its PR
  # ran everything twice.) Public repo → Actions minutes are free; this is about waiting time.
  pull_request:
    paths-ignore:
      - "spikes/**"
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "spikes/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        # PRs: Linux only (~1 min). main: Linux + Windows + macOS (golden save hash across OSes).
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
